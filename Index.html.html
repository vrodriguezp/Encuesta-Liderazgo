<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoevaluación Rueda del Liderazgo</title>
    <style>
        :root {
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --color-background-primary: #ffffff;
            --color-background-secondary: #f8f9fa;
            --color-border-tertiary: #e9ecef;
            --color-border-secondary: #dee2e6;
            --color-text-primary: #212529;
            --color-text-secondary: #6c757d;
            --border-radius-lg: 12px;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:var(--font-sans); background: #f4f7f6; padding: 20px;}
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: var(--border-radius-lg); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        /* Estilo para el campo de nombre */
        .user-info { margin-bottom: 25px; padding: 15px; background: #eef2f7; border-radius: 8px; border: 1px solid #d1d9e6; }
        .user-info label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #34495e; }
        .user-info input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; }
        .user-info input:focus { border-color: #378ADD; box-shadow: 0 0 0 2px rgba(55,138,221,0.2); }

        .dim-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:1rem}
        .dim-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
        .dim-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
        .dim-title{font-size:15px;font-weight:500;color:var(--color-text-primary)}
        .question{margin-bottom:1rem}
        .question-text{font-size:13px;color:var(--color-text-primary);line-height:1.5;margin-bottom:8px}
        .score-pills{display:flex;gap:4px}
        .pill{width:34px;height:28px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:transparent;font-size:13px;color:var(--color-text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
        .pill.selected{border-width:1.5px;font-weight:500}
        .dim-avg{font-size:12px;color:var(--color-text-secondary);margin-top:6px;text-align:right}
        .summary-section{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-top:1.5rem}
        .radar-wrap{display:flex;justify-content:center;margin:1rem 0}
        .progress-bar{height:4px;background:var(--color-border-tertiary);border-radius:2px;margin:1rem 0;overflow:hidden}
        .progress-fill{height:100%;background:#378ADD;transition:width .4s}
        .cta-row{display:flex; padding: 20px; justify-content: center; background: #f8f9fa; border-radius: 8px; margin-top: 20px;}
        .btn-send { background: #28a745; color: white; padding: 15px 30px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; max-width: 400px; }
        .btn-send:disabled { background: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; margin-bottom: 20px;">Autoevaluación Rueda del Liderazgo</h2>
    
    <!-- NUEVO CAMPO DE NOMBRE -->
    <div class="user-info">
        <label for="userName">Nombre y Apellido del Líder:</label>
        <input type="text" id="userName" placeholder="Escribe tu nombre completo aquí..." required>
    </div>

    <div id="app"></div>

    <div class="summary-section">
        <div style="font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:8px; text-align: center;">Tu Rueda del Liderazgo</div>
        <div id="radar-container" class="radar-wrap"></div>
        <div id="envio-container" class="cta-row">
            <button id="btnEnviar" class="btn-send" onclick="enviarAGoogle()">Enviar respuestas a consolidado</button>
        </div>
    </div>
</div>

<script>
const DIMS = [
  { id:"lid", label:"Liderazgo situacional", color:"#534AB7", bg:"#EEEDFE", text:"#3C3489", questions:["Soy consciente del nivel de autonomía de mi equipo.","Adapto mi estilo de liderazgo.","Identifico si el problema es habilidad o motivación.","Apoyo de formas diferentes."] },
  { id:"del", label:"Delegación efectiva", color:"#185FA5", bg:"#E6F1FB", text:"#0C447C", questions:["Delego con claridad.","Confío en la resolución de problemas.","Hago seguimiento sin microgestionar.","Identifico tareas delegables."] },
  { id:"tiempo", label:"Gestión del tiempo", color:"#854F0B", bg:"#FAEEDA", text:"#633806", questions:["Distingo urgente de importante.","Bloqueo tiempo estratégico.","Mi semana refleja mis prioridades.","Sé decir que no."] },
  { id:"com", label:"Comunicación e influencia", color:"#0F6E56", bg:"#E1F5EE", text:"#085041", questions:["El equipo entiende el rumbo.","Adapto mi mensaje.","Manejo conversaciones difíciles.","Influyo en stakeholders."] },
  { id:"dlv", label:"Delivery leadership", color:"#993C1D", bg:"#FAECE7", text:"#712B13", questions:["Tengo visibilidad del delivery.","Identifico riesgos anticipadamente.","Gestiono impedimentos.","Uso métricas."] },
  { id:"prod", label:"Gestión de producto", color:"#3B6D11", bg:"#EAF3DE", text:"#27500A", questions:["Entiendo el valor del producto.","Priorizo el backlog con criterio.","Mi roadmap refleja la estrategia.","Entiendo las necesidades del cliente."] },
  { id:"cambio", label:"Gestión del cambio", color:"#534AB7", bg:"#EEEDFE", text:"#3C3489", questions:["Entiendo la curva del cambio.","Comunico el porqué de los cambios.","Gestiono la resistencia.","Soy modelo del cambio."] },
  { id:"bien", label:"Bienestar y sostenibilidad", color:"#D4537E", bg:"#FBEAF0", text:"#72243E", questions:["Mantengo energía sostenida.","Reconozco señales de agotamiento.","Soy un modelo positivo.","Encuentro sentido al rol."] }
];

const SCALE = ["1","2","3","4","5"];
let answers = {};
DIMS.forEach(d => { answers[d.id] = {}; d.questions.forEach((_,i) => { answers[d.id][i] = null; }); });

function dimAvg(id) {
  const vals = Object.values(answers[id]).filter(v => v !== null);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}

function drawRadar(scores) {
  const n = DIMS.length; const cx=160,cy=160,r=110,size=320;
  const angle = i => (i/n)*2*Math.PI - Math.PI/2;
  const pt = (i,val) => { const a=angle(i); const rv=(val/5)*r; return [cx+Math.cos(a)*rv, cy+Math.sin(a)*rv]; };
  let gridLines='';
  [1,2,3,4,5].forEach(g=>{
    const pts=DIMS.map((_,i)=>{ const a=angle(i); return [cx+Math.cos(a)*(g/5)*r,cy+Math.sin(a)*(g/5)*r].join(',') }).join(' ');
    gridLines+=`<polygon points="${pts}" fill="none" stroke="#e9ecef" stroke-width="0.5"/>`;
  });
  const filled = scores.every(s=>s!==null);
  let polygon='';
  if(filled){
    const pts=scores.map((s,i)=>pt(i,s).join(',')).join(' ');
    polygon=`<polygon points="${pts}" fill="#378ADD" fill-opacity="0.18" stroke="#378ADD" stroke-width="1.5"/>`;
    scores.forEach((s,i)=>{ const [x,y]=pt(i,s); polygon+=`<circle cx="${x}" cy="${y}" r="3" fill="#185FA5"/>`; });
  }
  let labels='';
  DIMS.forEach((d,i)=>{
    const a=angle(i); const lx=cx+Math.cos(a)*130; const ly=cy+Math.sin(a)*130;
    const anchor=lx<cx-5?'end':lx>cx+5?'start':'middle';
    labels+=`<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="10" fill="#6c757d">${d.label.split(' ')[0]}</text>`;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${gridLines}${polygon}${labels}</svg>`;
}

function render() {
  const answered = DIMS.reduce((sum,d)=>sum+Object.values(answers[d.id]).filter(v=>v!==null).length,0);
  const totalQ = DIMS.reduce((s,d)=>s+d.questions.length,0);
  const pct = Math.round((answered/totalQ)*100);
  const scores = DIMS.map(d=>dimAvg(d.id));

  let html = `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  DIMS.forEach(d=>{
    const avg = dimAvg(d.id);
    html += `<div class="dim-card"><div class="dim-header"><div class="dim-badge" style="background:${d.bg};color:${d.text}">${DIMS.indexOf(d)+1}</div><div class="dim-title">${d.label}</div></div>`;
    d.questions.forEach((q,qi)=>{
      const isSel = answers[d.id][qi];
      html += `<div class="question"><div class="question-text">${q}</div><div class="score-pills">`;
      SCALE.forEach(s=>{
        const active = isSel == s;
        html += `<button class="pill${active?' selected':''}" style="${active?`background:${d.bg};border-color:${d.color};`:''}" onclick="setVal('${d.id}',${qi},${s})">${s}</button>`;
      });
      html += `</div></div>`;
    });
    html += `<div class="dim-avg">Sección: <strong>${avg!==null?avg.toFixed(1):'–'}</strong></div></div>`;
  });

  document.getElementById('app').innerHTML = html;
  document.getElementById('radar-container').innerHTML = drawRadar(scores);
}

window.setVal = (dim, qi, val) => { answers[dim][qi] = val; render(); };

function enviarAGoogle() {
  const btn = document.getElementById('btnEnviar');
  const nombre = document.getElementById('userName').value.trim();
  
  if(!nombre) {
      alert("Por favor, ingresa tu nombre completo.");
      document.getElementById('userName').focus();
      return;
  }

  const scores = { nombre: nombre }; // El nombre ahora encabeza el objeto
  DIMS.forEach(d => { scores[d.id] = dimAvg(d.id); });

  if(Object.values(scores).some(s => s === null)) {
      alert("Por favor, completa todas las secciones de la encuesta antes de enviar.");
      return;
  }

  btn.disabled = true; btn.innerText = 'Enviando...';
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSdksI1noa4Sfp-DAypUwOGJ3T2wfAL0MuohRyiTtACaavmzqQrbWXz1vzMz_QhJksPw/exec";

  fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(scores) })
  .then(() => { alert('¡Muchas gracias ' + nombre + '! Tus resultados se enviaron con éxito.'); btn.innerText = '¡Enviado!'; })
  .catch(() => { alert('Error al enviar. Intenta de nuevo.'); btn.disabled = false; btn.innerText = 'Reintentar'; });
}

render();
</script>
</body>
</html>
